$schema: https://m.canouil.dev/quarto-wizard/assets/schema/v1/extension-schema.json

formats:
  live-html:
    engine:
      type: string
      enum: [jupyter, knitr]
      description: Rendering engine used for live-html documents.
  live-revealjs:
    engine:
      type: string
      enum: [jupyter, knitr]
      description: Rendering engine used for live-revealjs slides.
  live-dashboard:
    engine:
      type: string
      enum: [jupyter, knitr]
      description: Rendering engine used for live dashboard output.

options:
  live:
    type: object
    description: Runtime toggles for exercise UI features.
    properties:
      show-solutions:
        type: boolean
        default: true
        description: Show solution blocks for exercises.
      show-hints:
        type: boolean
        default: true
        description: Show hint blocks for exercises.
      grading:
        type: boolean
        default: true
        description: Enable grading checks for exercises.
      labels:
        type: object
        description: >-
          Texts for editor buttons and default captions, overriding the built-in
          ones for the document language (`lang`; built in: en, sv). Keys: run-code,
          run-above, start-over, show-hint, next-hint, show-solution, caption-python,
          caption-r, caption-exercise.
